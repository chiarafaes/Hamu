name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: pip install "jsonschema>=4.18,<5"

      - name: Shared contract in sync
        run: bash scripts/sync-shared.sh --check

      - name: Shared contract unchanged by sync
        run: git diff --exit-code

      - name: JSON examples match schemas
        run: python3 scripts/validate.py

      - name: Content rules (front matter, no em-dashes, coverage)
        run: python3 scripts/check-content.py

      - name: Roll-up fixtures match schemas
        run: python3 scripts/validate.py tests/rollup/fixtures/audit/.audit

      - name: Roll-up unit tests
        run: python3 -m unittest discover -s tests/rollup -v
